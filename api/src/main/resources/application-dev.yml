# 本地开发便利配置（仅开发环境使用）：
# 启动时加 --spring.profiles.active=dev 或设置环境变量 SPRING_PROFILES_ACTIVE=dev。
# 生产环境禁止使用本 profile —— 默认（无 profile）即生产安全配置：
# JWT strict 模式开启、H2 控制台关闭、管理员密码必填。
spring:
  h2:
    console:
      enabled: ${IDOLCAL_H2_CONSOLE:true}

idolcal:
  auth:
    # 开发：允许未配置 JWT 密钥时自动生成随机密钥（重启后登录态失效）
    strict-jwt-secret: ${IDOLCAL_AUTH_STRICT_JWT_SECRET:false}
